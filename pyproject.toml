[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "nord-up"
version = "1.0.0"
description = "Stateless NordVPN NordLynx (WireGuard) connector: live fastest-server selection, tmpfs-only configs, pinned DNS, zero residue."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "nord-up contributors" }]
keywords = ["nordvpn", "nordlynx", "wireguard", "vpn", "wg-quick"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
nord-up = "nord_up.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nord_up"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RET", "ARG", "RUF"]
ignore = ["SIM108"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["nord_up"]
